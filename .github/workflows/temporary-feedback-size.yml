name: Temporary feedback size update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-feedback-size.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'chore: remove temporary feedback workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce feedback callout size
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('padding:24px 30px;text-align:center;border:1px solid rgba(82,214,197,.55)', 'padding:16px 22px;text-align:center;border:1px solid rgba(82,214,197,.55)')
          s = s.replace('font:700 16px var(--mono);letter-spacing:.12em;margin-bottom:10px', 'font:700 12px var(--mono);letter-spacing:.1em;margin-bottom:6px')
          s = s.replace('font-size:clamp(18px,2.3vw,28px);font-weight:700;line-height:1.45', 'font-size:clamp(12px,1.4vw,16px);font-weight:500;line-height:1.5')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: reduce feedback callout size'
          git push
