name: Update FADEC portfolio details

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Apply FADEC portfolio updates') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply portfolio updates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<div class="highlights"><div class="highlight"><b>7+ yrs</b><span>Experience</span></div><div class="highlight"><b>FADEC</b><span>Engine Control</span></div><div class="highlight"><b>DO-178C</b><span>Level A/B</span></div><div class="highlight"><b>MC/DC</b><span>Structural Coverage</span></div><div class="highlight"><b>Embedded C</b><span>Real-Time Software</span></div></div>'''
          new = '''<div class="highlights"><div class="highlight"><b>8+ Years</b><span>Experience</span></div><div class="highlight"><b>FADEC</b><span>Engine Control</span></div><div class="highlight"><b>DO-178C</b><span>Level A/B</span></div><div class="highlight"><b>Embedded C</b><span>Real-Time Software</span></div><div class="highlight"><b>MC/DC</b><span>Structural Coverage</span></div></div>'''
          if old not in s: raise SystemExit('Expected highlights block not found')
          s = s.replace(old, new, 1)
          old_css = '.feedback{position:relative;height:60px;margin:34px 9% 0;border-left:2px dashed rgba(82,214,197,.65);border-right:2px dashed rgba(82,214,197,.65);border-bottom:2px dashed rgba(82,214,197,.65);border-radius:0 0 20px 20px}'
          new_css = '.feedback{position:relative;height:60px;margin:34px 9% 0;border-left:2px dashed rgba(82,214,197,.65);border-right:2px dashed rgba(82,214,197,.65);border-bottom:2px dashed rgba(82,214,197,.65);border-radius:0 0 20px 20px}.feedback:before{content:\'↑\';position:absolute;left:-12px;top:-13px;color:var(--cyan);font:700 22px var(--mono);line-height:1;text-shadow:0 0 8px rgba(82,214,197,.25)}'
          if old_css not in s: raise SystemExit('Expected feedback CSS not found')
          s = s.replace(old_css, new_css, 1)
          old_label = '<strong>FEEDBACK &amp; VERIFICATION</strong><span>Engine response is measured and verified before the next control cycle.</span>'
          new_label = '<strong>↑ FEEDBACK &amp; VERIFICATION</strong><span>Engine response is measured and verified, then fed back toward the next control cycle.</span>'
          if old_label not in s: raise SystemExit('Expected feedback label not found')
          s = s.replace(old_label, new_label, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/update-fadec-highlights.yml
          git commit -m "Apply FADEC portfolio updates"
          git push